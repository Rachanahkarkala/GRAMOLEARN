{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}

<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">

<div class="auth-container">

    <div class="auth-card">

        <h1>🌿 Join Gramolearn</h1>

        <p>Create your account.</p>

        <form method="POST">

            <input
            type="text"
            name="username"
            placeholder="Username"
            required>

            <input
            type="email"
            name="email"
            placeholder="Email"
            required>

            <input
            type="password"
            name="password"
            placeholder="Password"
            required>

            <button type="submit">

                Register

            </button>

        </form>

        <p>

            Already have an account?

            <a href="/login">

                Login

            </a>

        </p>

    </div>

</div>

{% endblock %}
