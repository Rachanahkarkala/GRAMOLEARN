{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">

<div class="auth-container">

    <div class="auth-card">

        <h1>🦁 Welcome!</h1>

        <p>Login to continue your wildlife adventure.</p>

        <form method="POST">

            <input
            type="email"
            name="email"
            placeholder="Email"
            required>

            <input
            type="password"
            name="password"
            placeholder="Password"
            required>

            <button type="submit">

                Login

            </button>

        </form>

        <p>

            Don't have an account?

            <a href="/register">

                Register

            </a>

        </p>

    </div>

</div>

{% endblock %}
