{% extends "base.html" %}

{% block title %}
Quiz Result
{% endblock %}

{% block content %}

<link rel="stylesheet"
href="{{ url_for('static', filename='css/quiz_result.css') }}">

<div class="result-container">

    <h1>🎉 Quiz Completed!</h1>

    <h2>Your Score</h2>

    <div class="score-circle">

        {{ result.score }}

    </div>

    <a href="/quiz">

        <button class="again">

            Play Again

        </button>

    </a>

    <a href="/">

        <button class="home">

            Home

        </button>

    </a>

</div>

{% endblock %}
